<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETF 成分股篩選 — FundLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end}
    .ctl label{display:block;font-size:.72rem;font-weight:600;color:var(--text-muted);letter-spacing:.6px;margin-bottom:6px}
    .ctl input,.ctl select{width:100%;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-em);background:var(--bg-input);color:var(--text);font-family:var(--font);font-size:.875rem;outline:none;color-scheme:dark}
    .ctl input:focus,.ctl select:focus{border-color:var(--gold)}
    .topn-tabs{display:flex;gap:6px}
    .topn-tabs .period-btn{flex:1}
    .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:20px 0 16px}
    .summary-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px}
    .summary-card .metric-value{font-size:1.6rem;margin:8px 0 4px}
    .summary-card .sub{font-size:.78rem;color:var(--text-muted)}
    .notice{font-size:.8rem;color:var(--text-sub);background:rgba(230,184,74,.06);border:1px solid rgba(230,184,74,.2);border-radius:var(--radius-sm);padding:10px 14px;margin-top:14px;line-height:1.6}
    .notice.warn{background:rgba(255,107,107,.06);border-color:rgba(255,107,107,.25)}
    tr.selected td{background:rgba(230,184,74,.06)}
    tr.excluded td{opacity:.5}
    tr.excluded td.reason{opacity:.85}
    .reason{font-size:.75rem;color:var(--negative);white-space:normal;min-width:150px}
    .pass{font-size:.75rem;color:var(--positive);white-space:nowrap}
    .w-sub{display:block;font-size:.7rem;color:var(--text-muted);font-family:var(--font-mono)}
    .filter-card{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
    .filter-head{display:flex;align-items:center;gap:10px;font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:12px;cursor:pointer}
    .filter-head input{width:16px;height:16px;accent-color:var(--gold)}
    .filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end}
    .filter-grid.disabled{opacity:.4;pointer-events:none}
    .chk{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--text-sub);padding:9px 0}
    .chk input{width:16px;height:16px;accent-color:var(--gold)}
    .hint{font-size:.75rem;color:var(--text-muted);margin-top:10px;line-height:1.6}
    .filter-top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:14px}
    .filter-top .filter-head{margin-bottom:0;flex:1 1 220px}
    .filter-top .ctl{width:150px}
    .btn-sm{padding:7px 14px;font-size:.8rem}
    .ind-group{margin-top:12px}
    .ind-group-title{font-size:.72rem;font-weight:700;color:var(--gold);letter-spacing:.6px;margin-bottom:8px}
    .ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;align-items:end}
    .ind-tag{display:block;font-size:.65rem;font-weight:500;color:var(--text-muted);margin-top:2px;letter-spacing:0}
    .na{color:var(--text-muted);font-size:.75rem}
    #indicatorGroups.disabled{opacity:.4;pointer-events:none}
    .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-family:var(--font-mono);font-size:.78rem;font-weight:600;background:var(--bg-hover);color:var(--text-sub)}
    tr.selected .rank-badge{background:var(--gold);color:#0D1117}
    .chart-box{position:relative;height:340px}
    @media(max-width:640px){.chart-box{height:260px}}
    .funds-table td.name{white-space:nowrap}
    .num{font-family:var(--font-mono);text-align:right;white-space:nowrap}
    th.num{text-align:right}
    .loading{display:flex;align-items:center;gap:10px;color:var(--text-muted);padding:40px 0;justify-content:center}
    .spinner{width:18px;height:18px;border:2px solid var(--border-em);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Fund<span>Lens</span></a>
      <nav class="main-nav">
        <a href="index.html">首頁</a>
        <a href="screen.html" class="active">成分股篩選</a>
        <a href="compare.html">組合比較</a>
        <a href="score.html">評分排名</a>
        <a href="allocate.html">資產配置</a>
      </nav>
    </div>
  </header>

  <div class="fund-title-bar">
    <div class="container fund-title-inner">
      <div>
        <h1 class="fund-name">ETF 成分股篩選</h1>
        <p class="fund-meta">以 ETF 成分股為母體，先以財務指標篩選，再依報酬率排序取前 N 名組成等權重組合，並與 ETF 本身比較</p>
      </div>
    </div>
  </div>

  <main class="container page-main">

    <div class="card">
      <div class="controls">
        <div class="ctl">
          <label for="etfSelect">ETF</label>
          <select id="etfSelect"></select>
        </div>
        <div class="ctl">
          <label for="startDate">開始日期</label>
          <input type="date" id="startDate" />
        </div>
        <div class="ctl">
          <label for="endDate">結束日期</label>
          <input type="date" id="endDate" />
        </div>
        <div class="ctl">
          <label for="sortKey">排序依據</label>
          <select id="sortKey">
            <option value="period_return">期間報酬率</option>
            <option value="annualized_return">年化報酬率</option>
            <option value="sharpe">夏普值</option>
            <option value="annualized_std">年化波動率（低→高）</option>
            <option value="mdd">最大回檔（小→大）</option>
          </select>
        </div>
        <div class="ctl">
          <label>取前幾名</label>
          <div class="period-tabs topn-tabs" id="topnTabs" style="margin-bottom:0">
            <button class="period-btn" data-n="1">1</button>
            <button class="period-btn" data-n="2">2</button>
            <button class="period-btn active" data-n="3">3</button>
          </div>
        </div>
        <div class="ctl">
          <button id="runBtn" class="btn btn-primary" style="width:100%;justify-content:center;padding:10px">開始篩選</button>
        </div>
      </div>
      <p class="notice" id="etfNotice" style="display:none"></p>

      <div class="filter-card">
        <div class="filter-top">
          <label class="filter-head"><input type="checkbox" id="useFilter" checked /> 財務指標篩選（留白 = 不使用該條件）</label>
          <div class="ctl">
            <label for="finEnd">財報最後年度</label>
            <input type="number" id="finEnd" step="1" />
          </div>
          <button type="button" class="btn btn-outline btn-sm" id="presetThesis">論文預設</button>
          <button type="button" class="btn btn-ghost btn-sm" id="presetClear">全部清空</button>
        </div>
        <div id="indicatorGroups"><p class="hint">載入篩選指標中…</p></div>
        <p class="hint" id="filterHint"></p>
      </div>
    </div>

    <div id="result">
      <p class="placeholder-text" style="text-align:center;padding:48px 0">選好條件後按「開始篩選」。第一次會逐檔抓股價與財報，約需 1 分鐘，之後會使用快取。</p>
    </div>

  </main>

  <footer class="site-footer">
    <div class="container"><p>資料來源：FinMind｜本平台僅供學術研究，不構成投資建議</p></div>
  </footer>

  <!-- ?v= 避免瀏覽器快取到舊版 js；js 有改動時把數字加 1 -->
  <script src="js/api.js?v=2"></script>
  <script src="js/charts.js?v=2"></script>
  <script>
    const $ = id => document.getElementById(id);
    let topN = 3;
    let etfMeta = {};
    let screenChart = null;
    let indicators = [];           // 由後端 /screen/indicators 提供

    const pctClass = v => v == null ? "" : (v >= 0 ? "val-good" : "val-bad");
    const pctCell  = v => `<td class="num ${pctClass(v)}">${fmt(v, "pct2")}</td>`;
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

    // ── 初始化 ──────────────────────────────────
    (async function init() {
      const today = new Date();
      const iso = d => d.toISOString().slice(0, 10);
      $("startDate").value = `${today.getFullYear()}-01-01`;
      $("endDate").value   = iso(today);

      $("topnTabs").addEventListener("click", e => {
        const b = e.target.closest("button[data-n]");
        if (!b) return;
        document.querySelectorAll("#topnTabs .period-btn").forEach(x => x.classList.toggle("active", x === b));
        topN = Number(b.dataset.n);
      });
      $("runBtn").addEventListener("click", run);

      // 財報年度預設為開始日期的前一年；使用者手動改過就不再自動帶入
      let finEndTouched = false;
      const syncFinEnd = () => {
        if (!finEndTouched) $("finEnd").value = Number($("startDate").value.slice(0, 4)) - 1;
        updateFilterHint();
      };
      $("finEnd").addEventListener("input", () => { finEndTouched = true; updateFilterHint(); });
      $("startDate").addEventListener("change", () => { syncFinEnd(); showEtfNotice(); });
      $("useFilter").addEventListener("change", () => {
        $("indicatorGroups").classList.toggle("disabled", !$("useFilter").checked);
        updateFilterHint();
      });
      $("presetThesis").addEventListener("click", () => applyPreset("thesis"));
      $("presetClear").addEventListener("click", () => applyPreset("clear"));
      $("indicatorGroups").addEventListener("input", updateFilterHint);
      $("etfSelect").addEventListener("change", showEtfNotice);

      try {
        indicators = await apiFetch("/screen/indicators");
        buildIndicatorInputs();
      } catch (err) {
        $("indicatorGroups").innerHTML = `<p class="error-msg">無法載入篩選指標：${esc(err.message)}</p>`;
      }
      syncFinEnd();

      try {
        const etfs = await getEtfs();
        etfs.forEach(e => etfMeta[e.etf_id] = e);
        $("etfSelect").innerHTML = etfs.map(e =>
          `<option value="${esc(e.etf_id)}">${esc(e.etf_id.split("@")[0])} ${esc(e.name)}（${e.count} 檔${e.excluded ? `，${e.excluded} 檔暫不使用` : ""}）</option>`).join("");
        showEtfNotice();
      } catch (err) {
        showError("result", `無法連線後端：${err.message}`);
      }
    })();

    // ── 篩選指標欄位 ────────────────────────────
    const OP_TEXT = { ">": "＞", "<": "＜" };

    function indicatorLabel(ind) {
      if (ind.kind === "all_positive") return `${ind.label}（五年）`;
      const when = ind.kind === "point" ? "（開始日前一交易日）" : "五年平均";
      return `${ind.label} ${when} ${OP_TEXT[ind.op]}（${ind.unit}）`;
    }

    function buildIndicatorInputs() {
      const groups = [...new Set(indicators.map(i => i.group))];
      $("indicatorGroups").innerHTML = groups.map(g => `
        <div class="ind-group">
          <div class="ind-group-title">${esc(g)}</div>
          <div class="ind-grid">
            ${indicators.filter(i => i.group === g).map(i => {
              const tag = i.financial_na ? `<span class="ind-tag">金融股自動忽略</span>` : "";
              if (i.kind === "all_positive")
                return `<div class="ctl"><label class="chk"><input type="checkbox" data-ind="${i.key}" ${i.default ? "checked" : ""} /> ${esc(indicatorLabel(i))}${tag}</label></div>`;
              return `<div class="ctl">
                <label for="ind_${i.key}">${esc(indicatorLabel(i))}${tag}</label>
                <input type="number" id="ind_${i.key}" data-ind="${i.key}" step="any" placeholder="留白 = 不使用"
                       value="${i.default ?? ""}" />
              </div>`;
            }).join("")}
          </div>
        </div>`).join("");
      updateFilterHint();
    }

    function applyPreset(kind) {
      indicators.forEach(i => {
        const el = document.querySelector(`[data-ind="${i.key}"]`);
        if (!el) return;
        if (i.kind === "all_positive") el.checked = kind === "thesis" && !!i.default;
        else el.value = kind === "thesis" ? (i.default ?? "") : "";
      });
      updateFilterHint();
    }

    function filterParams() {
      const out = {};
      indicators.forEach(i => {
        const el = document.querySelector(`[data-ind="${i.key}"]`);
        if (!el) return;
        out[i.param] = i.kind === "all_positive" ? (el.checked ? 1 : 0) : el.value.trim();   // 空字串 = 不使用
      });
      return out;
    }

    function activeIndicatorNames() {
      return indicators.filter(i => {
        const el = document.querySelector(`[data-ind="${i.key}"]`);
        return el && (i.kind === "all_positive" ? el.checked : el.value.trim() !== "");
      }).map(i => i.label);
    }

    function updateFilterHint() {
      const y = Number($("finEnd").value);
      if (!$("useFilter").checked) {
        $("filterHint").textContent = "未啟用財務篩選，全部成分股直接依報酬率排序。";
        return;
      }
      const act = activeIndicatorNames();
      $("filterHint").textContent =
        `使用 ${y - 4}～${y} 年財報（共 5 年）。目前使用 ${act.length} 個條件${act.length ? "：" + act.join("、") : "（全部留白，等同不篩選）"}。` +
        "金融股遇到不適用的指標（毛利率、營業利益率、負債比率、流動比率）自動忽略，其他條件照常檢查。";
    }

    function showEtfNotice() {
      const e = etfMeta[$("etfSelect").value];
      const el = $("etfNotice");
      if (!e) { el.style.display = "none"; return; }
      el.style.display = "block";
      el.textContent = e.as_of
        ? `成分股名單日期：${e.as_of}（${e.source || ""}）。固定成分股，研究期間不隨 ETF 換股。`
        : `目前只有 ${e.count} 檔示範成分股，完整名單匯入後會顯示名單日期`;
      // 選了期末名單、開始日又早於名單日期 → 提醒有前視偏誤
      el.classList.toggle("warn", !!(e.as_of && $("startDate").value && e.as_of > $("startDate").value));
      if (el.classList.contains("warn"))
        el.textContent += ` ⚠ 名單日期晚於開始日期，會納入期間內才被加入的股票，報酬會被高估，僅供對照。`;
    }

    // ── 執行篩選 ────────────────────────────────
    async function run() {
      const etfId = $("etfSelect").value;
      const params = {
        start: $("startDate").value,
        end:   $("endDate").value,
        sort:  $("sortKey").value,
        top:   topN,
        filter: $("useFilter").checked ? 1 : 0,
      };
      if ($("useFilter").checked) {
        Object.assign(params, filterParams(), { fin_end: $("finEnd").value });
      }
      $("runBtn").disabled = true;
      $("result").innerHTML = `<div class="loading"><div class="spinner"></div>抓取股價與財報、計算中…（第一次約需 1 分鐘）</div>`;
      try {
        render(await screenEtf(etfId, params));
      } catch (err) {
        showError("result", err.message);
      } finally {
        $("runBtn").disabled = false;
      }
    }

    // ── 畫面 ────────────────────────────────────
    function render(d) {
      const pm = d.portfolio.metrics || {}, bm = d.benchmark.metrics || {};
      const diff = (pm.period_return != null && bm.period_return != null) ? pm.period_return - bm.period_return : null;
      const names = d.rankings.filter(r => r.selected).map(r => `${r.name}（${r.stock_id}）`).join("、");

      const notices = [];
      const src = (d.price_sources || []).join("、") || "—";
      if (d.adjusted) notices.push(`<p class="notice">股價來源：${esc(src)}（已含配息與分割調整）</p>`);
      else notices.push(`<p class="notice warn">股價來源：${esc(src)}。部分股票使用<strong>未還原</strong>收盤價，報酬率未含配息，會略為低估。</p>`);
      const f = d.filter || {};
      if (f.enabled) {
        const y = f.fin_years || [];
        const ruleText = (f.rules || []).map(r => r.kind === "all_positive" ? r.label
          : `${r.label} ${OP_TEXT[r.op]} ${r.threshold}${r.unit === "%" ? "%" : " " + r.unit}`).join("、") || "無（全部留白）";
        const fins = d.rankings.filter(r => r.filter && r.filter.is_financial).length;
        notices.push(`<p class="notice">財務篩選：${f.passed} / ${f.total} 檔通過（${y[0]}～${y[y.length - 1]} 年財報）。條件：${esc(ruleText)}。` +
          (fins ? `金融股 ${fins} 檔已自動忽略不適用的指標。` : "") + `未通過的股票列在表格最下方，並標示原因。</p>`);
      }
      if (!names) notices.push(`<p class="notice warn">沒有股票通過篩選，請放寬門檻。</p>`);
      if ((d.excluded_stocks || []).length) notices.push(`<p class="notice">暫不納入分析：${d.excluded_stocks.map(e =>
        `${esc(e.name || "")}（${esc(e.stock_id)}）— ${esc(e.reason)}`).join("；")}</p>`);
      if (d.errors.length) notices.push(`<p class="notice warn">以下成分股抓不到股價，未納入排序：${d.errors.map(e => esc(`${e.name || ""}（${e.stock_id}）`)).join("、")}</p>`);

      $("result").innerHTML = `
        <div class="summary-grid">
          <div class="summary-card">
            <div class="metric-label">${esc(d.portfolio.label)}</div>
            <div class="metric-value ${pctClass(pm.period_return)}">${fmt(pm.period_return, "pct2")}</div>
            <div class="sub">${esc(names) || "—"}</div>
          </div>
          <div class="summary-card">
            <div class="metric-label">${esc(d.benchmark.label)}</div>
            <div class="metric-value ${pctClass(bm.period_return)}">${fmt(bm.period_return, "pct2")}</div>
            <div class="sub">ETF 本身同期間報酬</div>
          </div>
          <div class="summary-card">
            <div class="metric-label">超額報酬</div>
            <div class="metric-value ${pctClass(diff)}">${diff == null ? "—" : (diff >= 0 ? "+" : "") + fmt(diff, "pct2")}</div>
            <div class="sub">${esc(d.window.start)} ～ ${esc(d.window.end)}</div>
          </div>
        </div>
        ${notices.join("")}

        <div class="card chart-card" style="margin:16px 0">
          <h3 class="card-title">走勢比較（起點 = 100）</h3>
          <div class="chart-box"><canvas id="screenChart"></canvas></div>
        </div>

        <div class="card">
          <h3 class="card-title">成分股排序｜依${esc(d.sort.label)}</h3>
          <div class="table-wrapper">
            <table class="funds-table">
              <thead><tr>
                <th>名次</th><th>代號</th><th>名稱</th>
                <th class="num">期間報酬率</th><th class="num">年化報酬率</th>
                <th class="num">年化波動率</th><th class="num">夏普值</th><th class="num">最大回檔</th>
                ${f.enabled ? (f.rules || []).map(r => `<th class="num">${esc(columnLabel(r))}</th>`).join("") + "<th>篩選</th>" : ""}
              </tr></thead>
              <tbody>${d.rankings.map(r => rowHtml(r, f.enabled ? (f.rules || []) : null)).join("")}</tbody>
            </table>
          </div>
          <p class="placeholder-text" style="margin-top:12px;font-size:.78rem">
            同一段期間內，期間報酬率與年化報酬率的排序結果相同；年化報酬率是把期間報酬換算成一年，期間未滿一年時僅供參考。
          </p>
        </div>`;

      drawScreenChart(d);
    }

    function columnLabel(r) {
      if (r.kind === "all_positive") return "EPS 最低";
      return r.kind === "point" ? r.label : `${r.label} 平均`;
    }

    function rowHtml(r, rules) {
      const m = r.metrics || {};
      const flt = r.filter || {}, v = flt.values || {}, checks = flt.checks || {};
      const cls = r.selected ? "selected" : (r.passed_filter === false ? "excluded" : "");
      const cell = rule => {
        if (checks[rule.key] === "skip") return `<td class="num na">不適用</td>`;
        const x = v[rule.key];
        if (x == null) return `<td class="num">—</td>`;
        const unit = rule.kind === "all_positive" ? "" : (rule.unit === "%" ? "%" : "");
        return `<td class="num ${checks[rule.key] === false ? "val-bad" : ""}">${x.toFixed(2)}${unit}</td>`;
      };
      const skipped = (flt.skipped || []).length ? `<span class="w-sub">金融股，忽略${esc(flt.skipped.join("、"))}</span>` : "";
      const filterCells = !rules ? "" : rules.map(cell).join("") + `
        <td class="${flt.passed ? "pass" : "reason"}">${flt.passed ? "✓ 通過" : esc((flt.reasons || []).join("；") || "未通過")}${skipped}</td>`;
      return `<tr class="${cls}">
        <td><span class="rank-badge">${r.rank ?? "—"}</span></td>
        <td class="mono">${esc(r.stock_id)}</td>
        <td class="name">${esc(r.name)}${r.weight == null ? "" : `<span class="w-sub">權重 ${r.weight.toFixed(2)}%</span>`}</td>
        ${pctCell(m.period_return)}
        ${pctCell(m.annualized_return)}
        <td class="num">${fmt(m.annualized_std, "pct2")}</td>
        <td class="num">${fmt(m.sharpe, "ratio")}</td>
        <td class="num val-bad">${fmt(m.mdd, "pct2")}</td>
        ${filterCells}
      </tr>`;
    }

    function drawScreenChart(d) {
      if (screenChart) screenChart.destroy();
      const lines = [
        { label: d.portfolio.label, series: d.portfolio.series, color: CHART_COLORS.gold,  width: 3 },
        { label: d.benchmark.label, series: d.benchmark.series, color: "#E6EDF3", width: 2, dash: [6, 4] },
        ...d.selected_series.map((s, i) => ({
          label: `${s.name}（${s.stock_id}）`, series: s.series,
          color: ["#60A5FA", "#3DD68C", "#A78BFA"][i % 3], width: 1.5,
        })),
      ];
      // 以日期對齊（各股交易日可能不同）
      const dates = [...new Set(lines.flatMap(l => l.series.map(p => p.date)))].sort();
      screenChart = new Chart($("screenChart").getContext("2d"), {
        type: "line",
        data: {
          labels: dates,
          datasets: lines.map(l => {
            const map = new Map(l.series.map(p => [p.date, p.normalized]));
            return {
              label: l.label, data: dates.map(dt => map.get(dt) ?? null),
              borderColor: l.color, backgroundColor: "transparent",
              borderWidth: l.width, borderDash: l.dash || [], pointRadius: 0, tension: .2, spanGaps: true,
            };
          }),
        },
        options: {
          ...BASE_OPTIONS,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            ...BASE_OPTIONS.plugins,
            tooltip: { ...BASE_OPTIONS.plugins.tooltip,
              callbacks: { label: it => it.raw == null ? null : ` ${it.dataset.label}：${Number(it.raw).toFixed(1)}` } },
          },
        },
      });
    }
  </script>
</body>
