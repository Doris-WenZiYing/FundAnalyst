<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETF 分析 — FundLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Fund<span>Lens</span></a>
      <nav class="main-nav">
        <a href="index.html">首頁</a>
        <a href="compare.html">組合比較</a>
        <a href="score.html">評分排名</a>
        <a href="allocate.html">資產配置</a>
      </nav>
    </div>
  </header>

  <div class="fund-title-bar">
    <div class="container fund-title-inner">
      <div>
        <h1 id="fundName" class="fund-name">載入中...</h1>
        <p id="fundMeta" class="fund-meta"></p>
      </div>
      <button id="addToCompareBtn" class="btn btn-outline">＋ 加入比較</button>
    </div>
  </div>

  <main class="container page-main">

    <div class="layout-two-col">
      <div class="card chart-card">
        <div class="period-tabs" id="navPeriodTabs">
          <button class="period-btn" data-period="1Y">1Y</button>
          <button class="period-btn active" data-period="3Y">3Y</button>
          <button class="period-btn" data-period="5Y">5Y</button>
        </div>
        <canvas id="navChart" height="220"></canvas>
      </div>

      <div class="card info-card">
        <h3 class="card-title">基本資訊</h3>
        <dl class="info-list">
          <dt>投信公司</dt><dd id="infoCompany">—</dd>
          <dt>類型</dt><dd id="infoType">—</dd>
          <dt>風險等級</dt><dd id="infoRisk">—</dd>
          <dt>基金規模</dt><dd id="infoAum">—</dd>
          <dt>最新收盤</dt><dd id="infoNav">—</dd>
          <dt>資料日期</dt><dd id="infoNavDate">—</dd>
        </dl>
      </div>
    </div>

    <section class="metrics-section">
      <h2 class="section-title">
        風險指標
        <span id="metricsPeriodLabel" class="period-label">（3Y）</span>
      </h2>
      <div class="metrics-grid" id="metricsGrid">
        <p class="placeholder-text">載入中...</p>
      </div>
    </section>

    <section class="benchmark-section">
      <h2 class="section-title">與 0050 比較（起點 = 100）</h2>
      <div class="card">
        <canvas id="benchmarkChart" height="200"></canvas>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>資料來源：FinMind｜本平台僅供學術研究，不構成投資建議</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script>
    const params  = new URLSearchParams(location.search);
    const FUND_ID = params.get("id");
    if (!FUND_ID) {
      document.body.innerHTML = `
        <div style="padding:80px;text-align:center;color:var(--text-muted)">
          <p style="font-size:1.1rem;margin-bottom:12px">缺少 ETF 代號</p>
          <a href="index.html" style="color:var(--gold)">← 回首頁</a>
        </div>`;
    }

    let currentPeriod = "3Y";

    async function loadFundInfo() {
      try {
        const f = await getFund(FUND_ID);
        document.title = `${f.name || FUND_ID} — FundLens`;
        document.getElementById("fundName").textContent = f.name || FUND_ID;
        document.getElementById("fundMeta").textContent =
          [f.company, f.type, f.fund_id].filter(Boolean).join("  ·  ");
        document.getElementById("infoCompany").textContent  = f.company      || "—";
        document.getElementById("infoType").textContent     = f.type         || "—";
        document.getElementById("infoRisk").textContent     = f.rr_label || (f.rr_rating ? `RR${f.rr_rating}` : "—");
        document.getElementById("infoAum").textContent      = f.aum != null ? `${Number(f.aum).toFixed(1)} 億` : "—";
        document.getElementById("infoNav").textContent      = f.nav != null ? Number(f.nav).toFixed(2) : "—";
        document.getElementById("infoNavDate").textContent  = f.nav_date || "—";

        document.getElementById("addToCompareBtn").addEventListener("click", () => {
          const added = addToCompare(FUND_ID, f.name || FUND_ID);
          if (added) alert(`已將「${f.name}」加入比較清單`);
          else       alert("此 ETF 已在比較清單中");
        });
      } catch (e) {
        document.getElementById("fundName").textContent = "載入失敗";
      }
    }

    async function loadNavChart(period) {
      try {
        const data = await getFundNav(FUND_ID, period);
        drawNavChart("navChart", data.fund);
        if (data.benchmark_normalized?.length) {
          drawBenchmarkChart(
            "benchmarkChart",
            data.fund_normalized,
            data.benchmark_normalized,
            "基金", "0050"
          );
        }
      } catch (e) {
        showError("navChart", e.message);
      }
    }

    async function loadMetrics(period) {
      const grid = document.getElementById("metricsGrid");
      document.getElementById("metricsPeriodLabel").textContent = `（${period}）`;
      grid.innerHTML = "<p class='placeholder-text'>計算中...</p>";
      try {
        const m = await getFundMetrics(FUND_ID, period);
        renderMetricCards("metricsGrid", m);
      } catch (e) {
        grid.innerHTML = `<p class="error-msg">⚠️ ${e.message}</p>`;
      }
    }

    document.getElementById("navPeriodTabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".period-btn");
      if (!btn) return;
      document.querySelectorAll("#navPeriodTabs .period-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentPeriod = btn.dataset.period;
      loadNavChart(currentPeriod);
      loadMetrics(currentPeriod);
    });

    if (FUND_ID) {
      loadFundInfo();
      loadNavChart(currentPeriod);
      loadMetrics(currentPeriod);
    }
  </script>
</body>
</html>
