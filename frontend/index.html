<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FundLens — 基金分析平台</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────── -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">FundLens</a>
      <nav class="main-nav">
        <a href="index.html" class="active">首頁</a>
        <a href="compare.html">投資組合比較</a>
      </nav>
    </div>
  </header>

  <!-- ── Hero 搜尋區 ──────────────────────────────── -->
  <section class="hero">
    <div class="container">
      <h1 class="hero-title">找到真正抗風險的基金</h1>
      <p class="hero-sub">以 Sharpe Ratio、MDD、Alpha 等風險調整指標，客觀評估每一檔基金</p>
      <div class="search-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="輸入基金名稱或代號..." />
        <button id="searchBtn" class="btn btn-primary">搜尋</button>
      </div>
    </div>
  </section>

  <!-- ── 高 Sharpe 排行 ──────────────────────────── -->
  <section class="section">
    <div class="container">
      <h2 class="section-title">高 Sharpe Ratio 排行（3Y）</h2>
      <div id="topFundsGrid" class="funds-grid">
        <p class="placeholder-text">載入中...</p>
      </div>
    </div>
  </section>

  <!-- ── 所有基金列表 ────────────────────────────── -->
  <section class="section section-alt">
    <div class="container">
      <h2 class="section-title">所有基金</h2>
      <div class="filter-bar">
        <select id="typeFilter" class="filter-select">
          <option value="">全部類型</option>
          <option value="股票型">股票型</option>
          <option value="債券型">債券型</option>
          <option value="平衡型">平衡型</option>
          <option value="貨幣型">貨幣型</option>
        </select>
      </div>
      <div class="table-wrapper">
        <table class="funds-table">
          <thead>
            <tr>
              <th>基金名稱</th>
              <th>公司</th>
              <th>類型</th>
              <th>最新 NAV</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="fundsTableBody">
            <tr><td colspan="5" class="placeholder-text">載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <p>本平台資料來源為 FinMind，僅供學術研究參考，不構成投資建議。</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script>
    // ── 渲染排行榜卡片 ──────────────────────────
    function renderTopFundCard(fund) {
      const sharpe = fund.sharpe != null ? Number(fund.sharpe).toFixed(2) : "—";
      return `
        <div class="fund-card" onclick="location.href='fund.html?id=${fund.fund_id}'">
          <div class="fund-card-name">${fund.name || fund.fund_id}</div>
          <div class="fund-card-company">${fund.company || ""}</div>
          <div class="fund-card-metrics">
            <span class="metric-badge">Sharpe <strong>${sharpe}</strong></span>
          </div>
        </div>`;
    }

    // ── 渲染基金列表列 ──────────────────────────
    function renderFundRow(fund) {
      const nav = fund.nav != null ? Number(fund.nav).toFixed(4) : "—";
      return `
        <tr onclick="location.href='fund.html?id=${fund.fund_id}'" style="cursor:pointer">
          <td><strong>${fund.name || fund.fund_id}</strong></td>
          <td>${fund.company || "—"}</td>
          <td>${fund.type || "—"}</td>
          <td class="mono">${nav}</td>
          <td><a href="fund.html?id=${fund.fund_id}" class="btn-link">查看分析 →</a></td>
        </tr>`;
    }

    // ── 載入排行榜 ──────────────────────────────
    async function loadTopFunds() {
      const grid = document.getElementById("topFundsGrid");
      try {
        const funds = await getFunds({ sort: "sharpe", limit: 5 });
        if (!funds.length) { grid.innerHTML = "<p class='placeholder-text'>暫無資料</p>"; return; }
        grid.innerHTML = funds.map(renderTopFundCard).join("");
      } catch (e) {
        grid.innerHTML = `<p class="error-msg">⚠️ ${e.message}</p>`;
      }
    }

    // ── 載入基金列表 ────────────────────────────
    async function loadFunds(params = {}) {
      const tbody = document.getElementById("fundsTableBody");
      tbody.innerHTML = `<tr><td colspan="5" class="placeholder-text">載入中...</td></tr>`;
      try {
        const funds = await getFunds(params);
        if (!funds.length) {
          tbody.innerHTML = `<tr><td colspan="5" class="placeholder-text">找不到符合的基金</td></tr>`;
          return;
        }
        tbody.innerHTML = funds.map(renderFundRow).join("");
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="error-msg">⚠️ ${e.message}</td></tr>`;
      }
    }

    // ── 事件綁定 ────────────────────────────────
    document.getElementById("searchBtn").addEventListener("click", () => {
      const q = document.getElementById("searchInput").value.trim();
      const type = document.getElementById("typeFilter").value;
      loadFunds({ q, type });
    });

    document.getElementById("searchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("searchBtn").click();
    });

    document.getElementById("typeFilter").addEventListener("change", () => {
      const q = document.getElementById("searchInput").value.trim();
      const type = document.getElementById("typeFilter").value;
      loadFunds({ q, type });
    });

    // ── 初始化 ──────────────────────────────────
    loadTopFunds();
    loadFunds();
  </script>
</body>
</html>
