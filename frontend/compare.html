<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>組合比較 — FundLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Fund<span>Lens</span></a>
      <nav class="main-nav">
        <a href="index.html">首頁</a>
        <a href="compare.html" class="active">組合比較</a>
        <a href="score.html">評分排名</a>
        <a href="allocate.html">資產配置</a>
        <a href="allocate.html">資產配置</a>
        <a href="allocate.html">最佳化配置</a>
      </nav>
    </div>
  </header>

  <main class="container page-main">

    <div class="compare-bar">
      <h1 class="compare-bar-title">組合比較</h1>
      <div id="compareChips" class="compare-chips"></div>
      <div class="compare-bar-actions">
        <button id="addFundBtn" class="btn btn-outline">＋ 新增 ETF</button>
        <button id="runCompareBtn" class="btn btn-primary">開始比較</button>
      </div>
    </div>

    <!-- Modal -->
    <div id="addFundModal" class="modal hidden">
      <div class="modal-inner">
        <h3>搜尋並加入 ETF</h3>
        <input type="text" id="modalSearch" class="search-input" placeholder="輸入名稱或代號..." />
        <div id="modalResults" class="modal-results"></div>
        <button id="closeModalBtn" class="btn btn-ghost">關閉</button>
      </div>
    </div>

    <div id="emptyState" class="empty-state">
      <p>請加入 2 檔以上 ETF，再點「開始比較」</p>
      <p style="margin-top:8px;font-size:0.82rem;color:var(--text-muted)">也可以從 ETF 分析頁按「＋ 加入比較」</p>
    </div>

    <div id="compareResult" class="hidden">

      <div class="period-tabs" id="comparePeriodTabs">
        <button class="period-btn" data-period="1Y">1Y</button>
        <button class="period-btn active" data-period="3Y">3Y</button>
        <button class="period-btn" data-period="5Y">5Y</button>
      </div>

      <div class="layout-two-col" style="margin-bottom:16px">
        <div class="card chart-card">
          <h3 class="card-title">報酬走勢比較（起點 = 100）</h3>
          <canvas id="overlayChart" height="220"></canvas>
        </div>
        <div class="card chart-card">
          <h3 class="card-title">指標雷達圖</h3>
          <canvas id="radarChart" height="220"></canvas>
        </div>
      </div>

      <div class="card">
        <h3 class="card-title">指標對比</h3>
        <div class="table-wrapper">
          <table class="compare-table">
            <thead id="compareTableHead"></thead>
            <tbody id="compareTableBody"></tbody>
          </table>
        </div>
      </div>

    </div>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>資料來源：FinMind｜本平台僅供學術研究，不構成投資建議</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script>
    let currentPeriod = "3Y";

    function renderChips() {
      const list  = getCompareList();
      const chips = document.getElementById("compareChips");
      chips.innerHTML = list.map(f => `
        <span class="chip">
          ${f.name || f.id}
          <button onclick="removeChip('${f.id}')">×</button>
        </span>`).join("");
    }

    function removeChip(fundId) {
      removeFromCompare(fundId);
      renderChips();
    }

    let modalTimer = null;
    document.getElementById("modalSearch").addEventListener("input", (e) => {
      clearTimeout(modalTimer);
      const q = e.target.value.trim();
      if (!q) { document.getElementById("modalResults").innerHTML = ""; return; }
      modalTimer = setTimeout(async () => {
        try {
          const funds = await getFunds({ q, limit: 8 });
          document.getElementById("modalResults").innerHTML =
            funds.map(f => `
              <div class="modal-result-item" onclick="addFromModal('${f.fund_id}','${(f.name||'').replace(/'/g,"\\'")}')">
                <strong>${f.name || f.fund_id}</strong>
                <span>${f.company || ""}</span>
              </div>`).join("") || "<p class='placeholder-text' style='padding:12px'>找不到結果</p>";
        } catch {
          document.getElementById("modalResults").innerHTML = "<p class='error-msg' style='padding:12px'>搜尋失敗</p>";
        }
      }, 300);
    });

    function addFromModal(fundId, fundName) {
      addToCompare(fundId, fundName);
      renderChips();
      document.getElementById("addFundModal").classList.add("hidden");
      document.getElementById("modalSearch").value = "";
      document.getElementById("modalResults").innerHTML = "";
    }

    document.getElementById("addFundBtn").addEventListener("click", () => {
      document.getElementById("addFundModal").classList.remove("hidden");
      document.getElementById("modalSearch").focus();
    });
    document.getElementById("closeModalBtn").addEventListener("click", () => {
      document.getElementById("addFundModal").classList.add("hidden");
    });

    const METRIC_ROWS = [
      { key: "annualized_return", label: "年化報酬",  format: v => fmt(v,"pct"),   higher: true  },
      { key: "sharpe",            label: "Sharpe",    format: v => fmt(v,"ratio"), higher: true  },
      { key: "sortino",           label: "Sortino",   format: v => fmt(v,"ratio"), higher: true  },
      { key: "calmar",            label: "Calmar",    format: v => fmt(v,"ratio"), higher: true  },
      { key: "mdd",               label: "MDD",       format: v => fmt(v,"pct"),   higher: false },
      { key: "beta",              label: "Beta",      format: v => fmt(v,"ratio"), higher: null  },
      { key: "alpha",             label: "Alpha",     format: v => fmt(v,"pct2"),  higher: true  },
      { key: "annualized_std",    label: "年化波動率",format: v => fmt(v,"pct"),   higher: false },
    ];

    function renderCompareTable(funds) {
      document.getElementById("compareTableHead").innerHTML = `<tr>
        <th>指標</th>
        ${funds.map(f => `<th>${f.name}</th>`).join("")}
      </tr>`;

      document.getElementById("compareTableBody").innerHTML = METRIC_ROWS.map(row => {
        const vals    = funds.map(f => f.metrics[row.key]);
        const numVals = vals.filter(v => v != null);
        const best    = row.higher === true  ? Math.max(...numVals) : row.higher === false ? Math.min(...numVals) : null;
        const worst   = row.higher === true  ? Math.min(...numVals) : row.higher === false ? Math.max(...numVals) : null;

        return `<tr>
          <td><strong style="color:var(--text-sub);font-size:0.82rem">${row.label}</strong></td>
          ${vals.map(v => {
            let cls = "";
            if (row.higher !== null && v != null) {
              if (v === best)  cls = "val-good";
              if (v === worst) cls = "val-bad";
            }
            return `<td class="mono ${cls}">${row.format(v)}</td>`;
          }).join("")}
        </tr>`;
      }).join("");
    }

    async function runCompare(period) {
      const list = getCompareList();
      if (list.length < 2) { alert("請先加入至少 2 檔 ETF"); return; }
      document.getElementById("emptyState").classList.add("hidden");
      document.getElementById("compareResult").classList.remove("hidden");
      document.getElementById("compareTableBody").innerHTML =
        `<tr><td colspan="${list.length + 1}" class="placeholder-text" style="padding:20px">計算中...</td></tr>`;

      try {
        const data  = await compareFunds(list.map(f => f.id), period);
        const funds = data.funds;
        drawOverlayChart("overlayChart", funds.map(f => ({ name: f.name, series: f.nav_series })));
        drawRadarChart("radarChart", funds.map(f => ({ name: f.name, metrics: f.metrics })));
        renderCompareTable(funds);
      } catch (e) {
        document.getElementById("compareTableBody").innerHTML =
          `<tr><td colspan="10" class="error-msg" style="padding:16px">⚠️ ${e.message}</td></tr>`;
      }
    }

    document.getElementById("runCompareBtn").addEventListener("click", () => runCompare(currentPeriod));

    document.getElementById("comparePeriodTabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".period-btn");
      if (!btn) return;
      document.querySelectorAll("#comparePeriodTabs .period-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentPeriod = btn.dataset.period;
      runCompare(currentPeriod);
    });

    renderChips();
    if (getCompareList().length < 2) {
      document.getElementById("emptyState").classList.remove("hidden");
    }
  </script>
</body>
</html>
