<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>資產配置最佳化 — FundLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    .step-card{margin-bottom:16px}
    .method-btn{padding:8px 18px;border-radius:var(--radius-sm);border:1px solid var(--border-em);background:transparent;color:var(--text-sub);font-size:.875rem;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .15s}
    .method-btn.active{background:var(--gold);color:#0D1117;border-color:var(--gold)}
    .method-tabs{display:flex;gap:8px}
    .result-grid{display:grid;grid-template-columns:260px 1fr;gap:16px;margin-bottom:16px}
    @media(max-width:800px){.result-grid{grid-template-columns:1fr}}
    .weight-table{width:100%;border-collapse:collapse;font-size:.875rem}
    .weight-table th{color:var(--text-muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
    .weight-table td{padding:10px 12px;border-bottom:1px solid var(--border)}
    .wbar-track{flex:1;height:4px;background:var(--bg-hover);border-radius:2px}
    .wbar-fill{height:100%;border-radius:2px}
    .compare-pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .compare-pill{padding:10px 14px;border-radius:var(--radius-md);background:var(--bg-hover);border:1px solid var(--border);flex:1;min-width:110px}
    .pill-label{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
    .pill-mvo{font-family:var(--font-mono);font-size:1.05rem;color:var(--gold)}
    .pill-equal{font-family:var(--font-mono);font-size:.8rem;color:var(--text-muted);margin-top:2px}
    .verdict-box{padding:14px 18px;background:var(--bg-hover);border-left:3px solid var(--gold);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:.875rem;color:var(--text-sub);margin-top:16px;line-height:1.9}
    .selected-chips{display:flex;flex-wrap:wrap;gap:8px;min-height:34px}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Fund<span>Lens</span></a>
      <nav class="main-nav">
        <a href="index.html">首頁</a>
        <a href="compare.html">組合比較</a>
        <a href="score.html">評分排名</a>
        <a href="allocate.html" class="active">資產配置</a>
      </nav>
    </div>
  </header>

  <div class="fund-title-bar">
    <div class="container fund-title-inner">
      <div>
        <h1 class="fund-name">資產配置最佳化</h1>
        <p class="fund-meta">均值變異數最佳化（MVO）求解最佳配比，並與等權重策略回測比較</p>
      </div>
    </div>
  </div>

  <main class="container page-main">

    <!-- Step 1 -->
    <div class="card step-card">
      <h3 class="card-title">Step 1 — 選擇 ETF（2–10 檔）</h3>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input type="text" id="fundSearch" class="search-input" placeholder="輸入名稱或代號..." style="max-width:320px" />
        <button id="searchBtn" class="btn btn-outline">搜尋</button>
      </div>
      <div id="searchResults" style="display:none;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;max-height:200px;overflow-y:auto;margin-bottom:12px"></div>
      <div style="font-size:.78rem;color:var(--text-muted);margin-bottom:8px">已選（<span id="selCount">0</span>/10）</div>
      <div id="selChips" class="selected-chips">
        <span style="color:var(--text-muted);font-size:.82rem">尚未選擇任何 ETF</span>
      </div>
    </div>

    <!-- Step 2 -->
    <div class="card step-card">
      <h3 class="card-title">Step 2 — 最佳化設定</h3>
      <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
        <div>
          <div style="font-size:.78rem;color:var(--text-muted);margin-bottom:8px">最佳化目標</div>
          <div class="method-tabs">
            <button class="method-btn active" data-method="max_sharpe">最大 Sharpe</button>
            <button class="method-btn" data-method="min_volatility">最小波動率</button>
          </div>
        </div>
        <div>
          <div style="font-size:.78rem;color:var(--text-muted);margin-bottom:8px">計算週期</div>
          <div class="period-tabs" id="allocPeriod">
            <button class="period-btn" data-period="1Y">1Y</button>
            <button class="period-btn active" data-period="3Y">3Y</button>
            <button class="period-btn" data-period="5Y">5Y</button>
          </div>
        </div>
        <div style="align-self:flex-end">
          <button id="runBtn" class="btn btn-primary" style="padding:10px 24px">計算最佳配置</button>
        </div>
      </div>
    </div>

    <!-- 結果 -->
    <div id="result" style="display:none">
      <h2 class="section-title">最佳化結果</h2>
      <div class="result-grid">
        <div class="card" style="display:flex;flex-direction:column;align-items:center;padding:20px">
          <h3 class="card-title">配置比例</h3>
          <canvas id="pieChart" width="220" height="220"></canvas>
        </div>
        <div class="card">
          <h3 class="card-title">權重明細</h3>
          <table class="weight-table"><thead id="wtHead"></thead><tbody id="wtBody"></tbody></table>
          <div class="compare-pills" id="metricPills"></div>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <h3 class="card-title">效率前緣（Efficient Frontier）</h3>
        <canvas id="frontierChart" height="200"></canvas>
      </div>
      <h2 class="section-title">回測驗證 — MVO vs 等權重</h2>
      <div class="card" style="margin-bottom:16px">
        <h3 class="card-title">投資組合績效走勢（起點 = 100）</h3>
        <canvas id="btChart" height="220"></canvas>
      </div>
      <div class="card" style="margin-bottom:16px">
        <h3 class="card-title">回檔幅度</h3>
        <canvas id="ddChart" height="160"></canvas>
      </div>
      <div class="verdict-box" id="verdict"></div>
    </div>

  </main>
  <footer class="site-footer">
    <div class="container"><p>資料來源：FinMind｜本平台僅供學術研究，不構成投資建議</p></div>
  </footer>

  <script src="js/api.js"></script>
  <script>
    const COLORS=["#E6B84A","#60A5FA","#3DD68C","#A78BFA","#FF6B6B","#F59E0B","#34D399","#818CF8","#F87171","#38BDF8"];
    let sel=[],method="max_sharpe",period="3Y";
    let pieI,frontI,btI,ddI;

    const BASE_SCALE={
      x:{ticks:{color:"#8B929D",maxTicksLimit:8,callback:function(v){return this.getLabelForValue(v)?.slice(0,7)||"";}},grid:{color:"rgba(255,255,255,0.06)"}},
      y:{ticks:{color:"#8B929D"},grid:{color:"rgba(255,255,255,0.06)"}}
    };

    async function doSearch(){
      const q=document.getElementById("fundSearch").value.trim();if(!q)return;
      const funds=await getFunds({q,limit:8});
      const box=document.getElementById("searchResults");
      box.style.display="block";
      box.innerHTML=funds.length?funds.map(f=>`
        <div onclick="addF('${f.fund_id}','${(f.name||'').replace(/'/g,"\\'")}')
" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;justify-content:space-between"
             onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background=''">
          <span style="font-size:.875rem;color:var(--text)">${f.name||f.fund_id}</span>
          <span style="font-size:.75rem;color:var(--text-muted)">${f.fund_id}</span>
        </div>`).join(""):`<div style="padding:12px;color:var(--text-muted);font-size:.875rem">找不到結果</div>`;
    }

    function addF(id,name){
      if(sel.find(f=>f.id===id))return;
      if(sel.length>=10){alert("最多10檔");return;}
      sel.push({id,name});renderChips();
      document.getElementById("searchResults").style.display="none";
      document.getElementById("fundSearch").value="";
    }

    function removeF(id){sel=sel.filter(f=>f.id!==id);renderChips();}

    function renderChips(){
      document.getElementById("selCount").textContent=sel.length;
      const box=document.getElementById("selChips");
      box.innerHTML=sel.length?sel.map((f,i)=>`
        <span class="chip" style="background:${COLORS[i%COLORS.length]}22;color:${COLORS[i%COLORS.length]};border-color:${COLORS[i%COLORS.length]}44">
          ${f.name||f.id}<button onclick="removeF('${f.id}')">×</button>
        </span>`).join(""):`<span style="color:var(--text-muted);font-size:.82rem">尚未選擇任何 ETF</span>`;
    }

    document.getElementById("searchBtn").addEventListener("click",doSearch);
    document.getElementById("fundSearch").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch();});

    document.querySelectorAll(".method-btn").forEach(b=>b.addEventListener("click",()=>{
      document.querySelectorAll(".method-btn").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");method=b.dataset.method;
    }));

    document.getElementById("allocPeriod").addEventListener("click",e=>{
      const b=e.target.closest(".period-btn");if(!b)return;
      document.querySelectorAll("#allocPeriod .period-btn").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");period=b.dataset.period;
    });

    document.getElementById("runBtn").addEventListener("click",async()=>{
      if(sel.length<2){alert("請先選至少 2 檔 ETF");return;}
      const btn=document.getElementById("runBtn");
      btn.disabled=true;btn.textContent="計算中...";
      try{
        const opt=await fetch("http://localhost:5000/optimize",{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({fund_ids:sel.map(f=>f.id),period,method})
        }).then(r=>r.json());
        if(opt.error)throw new Error(opt.error);
        renderOpt(opt);

        const bt=await fetch("http://localhost:5000/backtest",{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({fund_ids:opt.fund_ids,mvo_weights:opt.mvo.weights,period})
        }).then(r=>r.json());
        if(!bt.error)renderBt(bt);

        document.getElementById("result").style.display="block";
        document.getElementById("result").scrollIntoView({behavior:"smooth"});
      }catch(e){alert("⚠️ "+e.message);}
      finally{btn.disabled=false;btn.textContent="計算最佳配置";}
    });

    function renderOpt({mvo,equal,frontier,fund_names}){
      const w=mvo.weights,fids=Object.keys(w);

      if(pieI)pieI.destroy();
      pieI=new Chart(document.getElementById("pieChart"),{
        type:"doughnut",
        data:{labels:fids.map(f=>fund_names[f]||f),datasets:[{
          data:fids.map(f=>+(w[f]*100).toFixed(1)),
          backgroundColor:fids.map((_,i)=>COLORS[i%COLORS.length]+"CC"),
          borderColor:fids.map((_,i)=>COLORS[i%COLORS.length]),borderWidth:2
        }]},
        options:{cutout:"60%",plugins:{
          legend:{position:"bottom",labels:{color:"#8B929D",font:{size:11}}},
          tooltip:{backgroundColor:"#1E2535",callbacks:{label:i=>` ${i.label}：${i.raw}%`}}
        }}
      });

      document.getElementById("wtHead").innerHTML=`<tr><th>ETF</th><th>MVO</th><th>等權重</th><th>比重</th></tr>`;
      document.getElementById("wtBody").innerHTML=fids.map((f,i)=>`
        <tr>
          <td style="color:${COLORS[i%COLORS.length]}">${fund_names[f]||f}</td>
          <td class="mono">${(w[f]*100).toFixed(1)}%</td>
          <td class="mono" style="color:var(--text-muted)">${(equal.weights[f]*100).toFixed(1)}%</td>
          <td><div style="display:flex;align-items:center;gap:6px">
            <div class="wbar-track"><div class="wbar-fill" style="width:${w[f]*100}%;background:${COLORS[i%COLORS.length]}"></div></div>
          </div></td>
        </tr>`).join("");

      const PDEFS=[
        {k:"expected_return",l:"預期年化報酬",f:v=>(v*100).toFixed(1)+"%"},
        {k:"volatility",l:"年化波動率",f:v=>(v*100).toFixed(1)+"%"},
        {k:"sharpe",l:"Sharpe Ratio",f:v=>v.toFixed(2)},
      ];
      document.getElementById("metricPills").innerHTML=PDEFS.map(p=>`
        <div class="compare-pill">
          <div class="pill-label">${p.l}</div>
          <div class="pill-mvo">${mvo[p.k]!=null?p.f(mvo[p.k]):"—"}</div>
          <div class="pill-equal">等權重：${equal[p.k]!=null?p.f(equal[p.k]):"—"}</div>
        </div>`).join("");

      if(frontI)frontI.destroy();
      if(frontier?.length){
        frontI=new Chart(document.getElementById("frontierChart"),{
          type:"scatter",
          data:{datasets:[
            {label:"效率前緣",data:frontier.map(p=>({x:+(p.volatility*100).toFixed(2),y:+(p.return*100).toFixed(2)})),
             borderColor:"#60A5FA",backgroundColor:"rgba(96,165,250,0.12)",showLine:true,tension:0.3,pointRadius:3,borderWidth:2},
            {label:"MVO",data:[{x:+(mvo.volatility*100).toFixed(2),y:+(mvo.expected_return*100).toFixed(2)}],
             backgroundColor:"#E6B84A",pointRadius:8,pointStyle:"star"},
            {label:"等權重",data:[{x:+(equal.volatility*100).toFixed(2),y:+(equal.expected_return*100).toFixed(2)}],
             backgroundColor:"#6B7280",pointRadius:6},
          ]},
          options:{responsive:true,plugins:{
            legend:{labels:{color:"#8B929D"}},
            tooltip:{backgroundColor:"#1E2535",callbacks:{label:i=>` ${i.dataset.label}：波動率 ${i.raw.x}%，報酬 ${i.raw.y}%`}}
          },scales:{
            x:{title:{display:true,text:"年化波動率 (%)",color:"#8B929D"},ticks:{color:"#8B929D"},grid:{color:"rgba(255,255,255,0.06)"}},
            y:{title:{display:true,text:"預期年化報酬 (%)",color:"#8B929D"},ticks:{color:"#8B929D"},grid:{color:"rgba(255,255,255,0.06)"}}
          }}
        });
      }
    }

    function renderBt({mvo,equal,verdict}){
      const opts={responsive:true,plugins:{
        legend:{labels:{color:"#8B929D",font:{size:11}}},
        tooltip:{backgroundColor:"#1E2535",bodyColor:"#8B929D",titleColor:"#E6EDF3"}
      },scales:BASE_SCALE};

      if(btI)btI.destroy();
      btI=new Chart(document.getElementById("btChart"),{
        type:"line",
        data:{labels:mvo.nav_series?.map(d=>d.date)||[],datasets:[
          {label:"MVO",data:mvo.nav_series?.map(d=>d.value)||[],borderColor:"#E6B84A",backgroundColor:"transparent",tension:0.3,pointRadius:0,borderWidth:2},
          {label:"等權重",data:equal.nav_series?.map(d=>d.value)||[],borderColor:"#6B7280",backgroundColor:"transparent",tension:0.3,pointRadius:0,borderWidth:1.5,borderDash:[5,4]},
        ]},
        options:{...opts,scales:{...BASE_SCALE,y:{...BASE_SCALE.y,ticks:{...BASE_SCALE.y.ticks,callback:v=>v.toFixed(0)}}}}
      });

      if(ddI)ddI.destroy();
      ddI=new Chart(document.getElementById("ddChart"),{
        type:"line",
        data:{labels:mvo.drawdown_series?.map(d=>d.date)||[],datasets:[
          {label:"MVO 回檔",data:mvo.drawdown_series?.map(d=>+(d.value*100).toFixed(2))||[],borderColor:"#E6B84A",backgroundColor:"rgba(230,184,74,0.06)",fill:true,tension:0.3,pointRadius:0,borderWidth:1.5},
          {label:"等權重回檔",data:equal.drawdown_series?.map(d=>+(d.value*100).toFixed(2))||[],borderColor:"#6B7280",backgroundColor:"rgba(107,114,128,0.06)",fill:true,tension:0.3,pointRadius:0,borderWidth:1.5,borderDash:[5,4]},
        ]},
        options:{...opts,scales:{...BASE_SCALE,y:{...BASE_SCALE.y,ticks:{...BASE_SCALE.y.ticks,callback:v=>v.toFixed(1)+"%"}}}}
      });

      document.getElementById("verdict").innerHTML=verdict.split("｜").map(s=>`<div>▸ ${s}</div>`).join("");
    }
  </script>
</body>
</html>
